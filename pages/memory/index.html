<!doctype html>
<html lang="zh-CN" data-skin="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MemoryScope</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="ms-app">
      <header class="ms-top">
        <div class="ms-brand">
          <span class="ms-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <rect x="4" y="7" width="16" height="10" rx="2" />
              <path d="M8 7V4M12 7V4M16 7V4M8 20v-3M12 20v-3M16 20v-3" />
              <path d="M8.5 11.5h2.2l1.1 3 1.2-4.6 1 1.6h1.5" />
            </svg>
          </span>
          <div class="ms-brand-text">
            <h1 id="page-title">MemoryScope 内存观察</h1>
            <p id="page-desc">用轻量探针观察进程、插件导入成本与运行时对象</p>
          </div>
        </div>
        <div class="ms-top-actions">
          <div class="ms-field">
            <label id="auto-label" for="auto-select">自动刷新</label>
            <select id="auto-select" class="ms-input"></select>
          </div>
          <div class="ms-field">
            <label id="skin-label" for="skin-select">主题</label>
            <select id="skin-select" class="ms-input"></select>
          </div>
          <button id="btn-refresh" class="ms-btn ms-btn-primary" type="button" data-i18n="action.refresh">刷新</button>
          <button id="btn-deep" class="ms-btn" type="button" data-i18n="action.deep">引用图扫描</button>
        </div>
      </header>

      <section id="banner" class="ms-banner" hidden>
        <span class="ms-banner-ico" aria-hidden="true">!</span>
        <div class="ms-banner-body">
          <strong id="banner-title"></strong>
          <p id="banner-text"></p>
        </div>
      </section>

      <nav class="ms-tabs" role="tablist" aria-label="MemoryScope">
        <button class="ms-tab is-active" type="button" role="tab" data-tab="overview" aria-selected="true">
          <span class="ms-tab-ico" aria-hidden="true">◧</span><span data-i18n="tab.overview">总览</span>
        </button>
        <button class="ms-tab" type="button" role="tab" data-tab="plugins" aria-selected="false">
          <span class="ms-tab-ico" aria-hidden="true">▥</span><span data-i18n="tab.plugins">插件</span>
        </button>
        <button class="ms-tab" type="button" role="tab" data-tab="imports" aria-selected="false">
          <span class="ms-tab-ico" aria-hidden="true">↗</span><span data-i18n="tab.imports">导入成本</span>
        </button>
        <button class="ms-tab" type="button" role="tab" data-tab="audit" aria-selected="false">
          <span class="ms-tab-ico" aria-hidden="true">⌕</span><span data-i18n="tab.audit">依赖审计</span>
        </button>
        <button class="ms-tab" type="button" role="tab" data-tab="census" aria-selected="false">
          <span class="ms-tab-ico" aria-hidden="true">◌</span><span data-i18n="tab.census">对象普查</span>
        </button>
        <button class="ms-tab" type="button" role="tab" data-tab="alerts" aria-selected="false">
          <span class="ms-tab-ico" aria-hidden="true">◈</span><span data-i18n="tab.alerts">告警</span><span id="alert-badge" class="ms-badge" hidden>0</span>
        </button>
        <button class="ms-tab" type="button" role="tab" data-tab="help" aria-selected="false">
          <span class="ms-tab-ico" aria-hidden="true">ℹ</span><span data-i18n="tab.help">指标说明</span>
        </button>
      </nav>

      <main class="ms-panels">
        <section class="ms-panel is-active" id="panel-overview" role="tabpanel">
          <div class="ms-cards" id="cards"></div>
          <div class="ms-grid2">
            <section class="ms-card ms-card-wide">
              <header class="ms-card-head">
                <div>
                  <h2 data-i18n="chart.rssTitle">进程 RSS 趋势</h2>
                  <p class="ms-card-caption" id="rss-caption"></p>
                </div>
                <div class="ms-card-tools">
                  <button id="btn-baseline-set" class="ms-btn ms-btn-ghost ms-btn-sm" type="button" data-i18n="action.baselineSet">设为基线</button>
                  <button id="btn-baseline-clear" class="ms-btn ms-btn-ghost ms-btn-sm" type="button" data-i18n="action.baselineClear">清除基线</button>
                  <button id="btn-gc" class="ms-btn ms-btn-ghost ms-btn-sm" type="button" data-i18n="action.gc">手动 GC</button>
                </div>
              </header>
              <div id="rss-chart" class="ms-chart"></div>
            </section>
            <section class="ms-card">
              <header class="ms-card-head">
                <div>
                  <h2 data-i18n="chart.topTitle">当前重点插件</h2>
                  <p class="ms-card-caption" id="top-caption"></p>
                </div>
              </header>
              <div id="top-bars" class="ms-bars"></div>
            </section>
          </div>
          <div class="ms-grid2">
            <section class="ms-card">
              <header class="ms-card-head"><h2 data-i18n="breakdown.title">对象普查来源</h2></header>
              <p class="ms-hint" id="breakdown-hint"></p>
              <div id="breakdown-bars" class="ms-bars"></div>
            </section>
            <section class="ms-card">
              <header class="ms-card-head"><h2 data-i18n="probe.title">探针状态</h2></header>
              <div id="probe-status" class="ms-status-list"></div>
            </section>
          </div>
        </section>

        <section class="ms-panel" id="panel-plugins" role="tabpanel">
          <div class="ms-toolbar">
            <input id="search" class="ms-input ms-search" type="search" placeholder="搜索插件名…" />
            <span id="plugin-count" class="ms-chip ms-chip-quiet"></span>
            <span id="census-state" class="ms-chip"></span>
            <span id="deep-state" class="ms-chip"></span>
          </div>
          <p class="ms-hint" id="plugin-hint"></p>
          <div class="ms-table-wrap">
            <table class="ms-table" id="plugin-table">
              <thead><tr id="plugin-head"></tr></thead>
              <tbody id="plugin-body"></tbody>
            </table>
          </div>
        </section>

        <section class="ms-panel" id="panel-imports" role="tabpanel">
          <div class="ms-section-head">
            <div>
              <h2 data-i18n="imports.title">加载期导入成本</h2>
              <p class="ms-hint" data-i18n="imports.desc">只在启动阶段短暂记录 RSS 差分，页面刷新不会继续包裹导入函数。</p>
            </div>
          </div>
          <div id="import-cards" class="ms-cards ms-cards-compact"></div>
          <section class="ms-card">
            <header class="ms-card-head"><h2 data-i18n="imports.packages">首次加载的第三方包</h2></header>
            <p class="ms-hint" id="package-hint"></p>
            <div class="ms-table-wrap ms-table-inner">
              <table class="ms-table"><thead><tr id="package-head"></tr></thead><tbody id="package-body"></tbody></table>
            </div>
          </section>
          <section class="ms-card">
            <header class="ms-card-head"><h2 data-i18n="imports.plugins">插件加载汇总</h2></header>
            <div class="ms-table-wrap ms-table-inner">
              <table class="ms-table"><thead><tr id="import-plugin-head"></tr></thead><tbody id="import-plugin-body"></tbody></table>
            </div>
          </section>
        </section>

        <section class="ms-panel" id="panel-audit" role="tabpanel">
          <section class="ms-card">
            <header class="ms-card-head">
              <div>
                <h2 data-i18n="audit.title">顶层依赖审计</h2>
                <p class="ms-hint" id="audit-summary"></p>
              </div>
              <button id="btn-audit" class="ms-btn ms-btn-primary ms-btn-sm" type="button" data-i18n="action.audit">重新审计</button>
            </header>
            <p class="ms-hint" data-i18n="audit.desc">扫描源代码中模块顶层的重依赖；把不必开机加载的包移到函数内，才可能减少启动期内存。</p>
            <div class="ms-table-wrap ms-table-inner">
              <table class="ms-table"><thead><tr id="audit-head"></tr></thead><tbody id="audit-body"></tbody></table>
            </div>
            <div id="audit-unknown" class="ms-callout" hidden></div>
          </section>
        </section>

        <section class="ms-panel" id="panel-census" role="tabpanel">
          <section class="ms-card">
            <header class="ms-card-head">
              <div>
                <h2 data-i18n="census.title">运行时对象普查</h2>
                <p class="ms-hint" id="census-summary"></p>
              </div>
              <button id="btn-census" class="ms-btn ms-btn-primary ms-btn-sm" type="button" data-i18n="action.census">运行一次</button>
            </header>
            <div id="census-warning" class="ms-callout ms-callout-warn"></div>
            <div id="census-plugin-bars" class="ms-bars ms-bars-large"></div>
            <h3 class="ms-subheading" data-i18n="census.buckets">其他对象来源</h3>
            <div id="census-bucket-bars" class="ms-bars"></div>
          </section>
        </section>

        <section class="ms-panel" id="panel-alerts" role="tabpanel">
          <section class="ms-card">
            <header class="ms-card-head"><h2 data-i18n="alerts.title">告警记录</h2></header>
            <p class="ms-hint" id="alerts-summary"></p>
            <div id="alerts" class="ms-list"></div>
          </section>
        </section>

        <section class="ms-panel" id="panel-help" role="tabpanel">
          <section class="ms-card">
            <header class="ms-card-head"><h2 data-i18n="help.title">怎么看这些数字</h2></header>
            <dl class="ms-help" id="help-list"></dl>
          </section>
          <section class="ms-card">
            <header class="ms-card-head"><h2 data-i18n="help.safetyTitle">小内存机器建议</h2></header>
            <ul class="ms-bullets" id="safety-list"></ul>
          </section>
        </section>
      </main>
    </div>

    <div id="drawer" class="ms-drawer" hidden>
      <div class="ms-drawer-scrim" data-close="1"></div>
      <aside class="ms-drawer-body" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <header class="ms-drawer-head">
          <h2 id="drawer-title">插件详情</h2>
          <button id="drawer-close" class="ms-btn ms-btn-ghost ms-btn-sm" type="button" data-i18n="action.close">关闭</button>
        </header>
        <div id="drawer-content" class="ms-drawer-content"></div>
      </aside>
    </div>

    <div id="toast" class="ms-toast" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
