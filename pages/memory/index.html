<!doctype html>
<html lang="zh-CN" data-scope-theme="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>MemoryScope · 内存观察台</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body data-mode="embedded">
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#overview" aria-label="MemoryScope"
          ><svg
            class="brand-mark"
            viewBox="0 0 40 40"
            fill="none"
            aria-hidden="true"
          >
            <rect x="1" y="1" width="38" height="38" rx="12" />
            <path d="M8 24h6l4-13 5 20 4-13 3 6h3" /></svg
          ><span
            >Memory<span class="brand-light">Scope</span
            ><small data-t="brand.sub">内存观察台</small></span
          ></a
        >
        <div class="header-controls">
          <label class="sr-only" for="locale" data-t="language">语言</label
          ><select id="locale" class="compact">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option></select
          ><label class="sr-only" for="theme" data-t="theme">主题</label
          ><select id="theme" class="compact">
            <option value="paper" data-t="theme.paper">砂白</option>
            <option value="midnight" data-t="theme.midnight">深海</option>
            <option value="plum" data-t="theme.plum">暮紫</option></select
          ><button id="export" class="quiet" data-t="export">导出报告</button>
        </div>
      </header>
      <div class="navrow">
        <nav id="navigation" aria-label="页面导航"></nav>
        <span id="connection" class="connection" role="status"
          ><i></i><span data-t="connecting">连接中</span></span
        >
      </div>
      <form id="auth" class="auth card" hidden>
        <div>
          <h1 data-t="auth.title">连接观察后端</h1>
          <p data-t="auth.desc">
            使用后端配置文件中的 token。凭据仅保留在当前页面内存。
          </p>
        </div>
        <label for="token" data-t="auth.token">后端访问凭据</label>
        <div class="inline">
          <input
            id="token"
            type="password"
            autocomplete="off"
            required
          /><button class="primary" data-t="connect">连接</button>
        </div>
      </form>
      <div id="notice" class="notice" role="status" hidden></div>
      <main id="workspace" tabindex="-1">
        <div class="page-heading">
          <div>
            <p class="eyebrow" id="eyebrow">MEMORY OBSERVATORY</p>
            <h1 id="page-title">总览</h1>
            <p id="page-subtitle" class="muted"></p>
          </div>
          <div class="refresh-controls">
            <span id="updated" class="muted"></span
            ><label class="sr-only" for="autorefresh" data-t="auto"
              >自动刷新</label
            ><select id="autorefresh">
              <option value="15" data-t="auto.15">每 15 秒</option>
              <option value="60" data-t="auto.60">每 60 秒</option>
              <option value="0" data-t="auto.off">暂停刷新</option></select
            ><button id="refresh" data-t="refresh">刷新</button>
          </div>
        </div>
        <div id="content" aria-busy="true">
          <div class="loading" data-t="loading">正在读取数据…</div>
        </div>
      </main>
      <footer>
        <span
          >MemoryScope <span class="footer-dot">·</span
          ><span data-t="footer">让每一份占用，都有依据。</span></span
        ><button data-go="guide" class="text-button" data-t="metrics.help">
          如何理解这些数字 ↗
        </button>
      </footer>
    </div>
    <div id="drawer" class="drawer-backdrop" hidden>
      <section
        class="drawer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detail-title"
        tabindex="-1"
      >
        <header class="drawer-head">
          <span class="eyebrow">PLUGIN INSIGHT</span
          ><button id="close-drawer" data-t="close">关闭</button>
        </header>
        <div id="detail"></div>
      </section>
    </div>
    <dialog id="confirm">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-text"></p>
        <div class="dialog-actions">
          <button value="cancel" data-t="cancel">取消</button
          ><button value="confirm" class="primary" data-t="continue">
            确认执行
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
